name: Run Tests with MinIO

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      minio:
        image: quay.io/minio/minio
        ports:
          - 9000:9000
          - 9001:9001
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin123
        options: >-
          --health-cmd="curl -f http://localhost:9000/minio/health/ready || exit 1"
          --health-interval=5s
          --health-retries=5
          --health-start-period=10s
          --health-timeout=3s
        command: server /data --console-address ":9001"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for MinIO to be healthy
        run: |
          echo "Waiting for MinIO to be ready..."
          for i in {1..10}; do
            if curl -f http://localhost:9000/minio/health/ready; then
              echo "MinIO is ready!"
              break
            else
              echo "MinIO not ready yet. Retrying in 3s..."
              sleep 3
            fi
          done

      - name: Run tests
        run: |
          # Run your actual tests here
          echo "MinIO is up. Running tests..."
